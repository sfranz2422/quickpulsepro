{% comment %}
Markdown editing (EasyMDE) and code highlighting (highlight.js).
Included only on the pages that need them so the rest of the site stays light.
{% endcomment %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">

<style>
    .markdown-body pre {
        background: #f6f8fa;
        padding: 0.9rem 1rem;
        border-radius: 0.375rem;
        overflow-x: auto;
    }

    .markdown-body code {
        font-size: 0.925em;
    }

    .markdown-body p:last-child {
        margin-bottom: 0;
    }

    /* Fill in the blank: the box sits inline in the sentence. */
    .blank-input {
        display: inline-block;
        width: 11em;
        max-width: 100%;
        padding: 0.1rem 0.4rem;
        margin: 0.15rem 0.1rem;
        vertical-align: baseline;
    }

    /* Where a blank goes, on the teacher's screens. */
    .blank-slot {
        display: inline-block;
        min-width: 4em;
        padding: 0 0.4rem;
        border-bottom: 2px solid #6c757d;
        color: #6c757d;
        font-size: 0.85em;
        text-align: center;
    }

    .EasyMDEContainer .CodeMirror {
        font-size: 0.95rem;
    }
</style>
